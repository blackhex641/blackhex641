<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackhex Admin Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="toast" id="toast"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">BLACKHEX</div>
    <div class="login-subtitle">Admin Access Portal</div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" class="form-input" id="usernameInput" placeholder="Enter username" autocomplete="off" />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="passwordInput" placeholder="Enter password" />
    </div>

    <button class="submit-btn" id="loginBtn" onclick="doLogin()">
      AUTHENTICATE
    </button>

    <div class="text-center text-muted mt-10" style="font-size:0.7rem;letter-spacing:1px;">
      ◈ Secure Admin Panel ◈
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('bh_admin_token')) {
    window.location.href = 'admin.html';
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  async function doLogin() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      showToast('Please fill all fields', 'error'); return;
    }

    btn.innerHTML = '<span class="loading-spinner"></span> AUTHENTICATING...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('bh_admin_token', data.token);
        showToast('Access granted! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
      } else {
        showToast(data.error || 'Invalid credentials', 'error');
        btn.innerHTML = 'AUTHENTICATE';
        btn.disabled = false;
      }
    } catch (err) {
      showToast('Connection error', 'error');
      btn.innerHTML = 'AUTHENTICATE';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
